name: update

on:
  schedule:
    # Twice a day: 05:30 and 17:30 Kyiv in summer, 04:30 and 16:30 in winter.
    - cron: '30 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/update.mjs
        env:
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/poltavskyi.json
          git commit -m "data: $(date -u +%F)"
          git push
